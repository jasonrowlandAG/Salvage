[project]
name = "salvage"
version = "0.1.0"
description = "Free, open-source file recovery desktop app built on PhotoRec"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
    "pillow>=10",
    "pillow-heif>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
salvage = "salvage.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["salvage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
