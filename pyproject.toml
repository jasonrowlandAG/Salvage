[project]
name = "salvage"
version = "0.1.0"
description = "Free, open-source file recovery desktop app built on PhotoRec"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
    "pillow>=10",
    "pillow-heif>=0.18",
    "pycryptodome>=3.20",
    # There is no pty on Windows, and PhotoRec/Sleuth Kit block-buffer their stdout
    # when it isn't a real console -- pywinpty gives the Windows scan path a ConPTY
    # so live progress works there too (see salvage/engine/photorec.py).
    "pywinpty>=2.0.14; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.22"]

[project.scripts]
salvage = "salvage.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["salvage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests that drive the real Qt UI offscreen (slower, still run by default).",
    "slow: builds a real hdiutil disk image and runs the real PhotoRec binary; skipped automatically if either is unavailable.",
]
