[project]
name = "salvage"
version = "0.1.0"
description = "Free, open-source file recovery desktop app built on PhotoRec"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
    "pillow>=10",
    "pi-heif>=1.4",  # decode-only sibling of pillow-heif: no x265/GPLv2 in the wheel
    "pycryptodome>=3.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.22"]

[project.scripts]
salvage = "salvage.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["salvage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests that drive the real Qt UI offscreen (slower, still run by default).",
    "slow: builds a real hdiutil disk image and runs the real PhotoRec binary; skipped automatically if either is unavailable.",
]
