name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install recovery tools (macOS)
        if: runner.os == 'macOS'
        run: brew install testdisk sleuthkit

      - name: Install recovery tools + Qt offscreen libs (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y testdisk sleuthkit libegl1 libxkbcommon0 libgl1 libdbus-1-3 libpulse0

      - name: Install recovery tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"  # Invoke-WebRequest's progress bar is extremely slow in CI logs
          $tools = "$env:RUNNER_TEMP\tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          # Unauthenticated api.github.com calls are capped at 60/hour per source IP,
          # shared across every job hitting GitHub's IP ranges at once -- easy to trip
          # even from a single workflow's own test+build jobs running together. The
          # built-in token raises that to 5000/hour and needs no extra permissions.
          $ghHeaders = @{ Authorization = "Bearer $env:GH_TOKEN" }

          Write-Host "==> Downloading TestDisk/PhotoRec 7.2 (Windows 64-bit)"
          Invoke-WebRequest -Uri "https://www.cgsecurity.org/testdisk-7.2.win64.zip" -OutFile "$tools\testdisk.zip"
          Expand-Archive -Path "$tools\testdisk.zip" -DestinationPath "$tools\testdisk" -Force
          $photorecDir = (Get-ChildItem -Path "$tools\testdisk" -Recurse -Filter "photorec_win.exe" | Select-Object -First 1).DirectoryName
          if (-not $photorecDir) { throw "photorec_win.exe not found after extracting testdisk-7.2.win64.zip" }
          Add-Content -Path $env:GITHUB_PATH -Value $photorecDir

          Write-Host "==> Downloading the latest Sleuth Kit Windows release"
          $skRelease = Invoke-RestMethod -Uri "https://api.github.com/repos/sleuthkit/sleuthkit/releases/latest" -Headers $ghHeaders
          $skAsset = $skRelease.assets | Where-Object { $_.name -like "*win32*.zip" -or $_.name -like "*win64*.zip" } | Select-Object -First 1
          if (-not $skAsset) { throw "no Windows zip asset found on the latest sleuthkit release" }
          Invoke-WebRequest -Uri $skAsset.browser_download_url -OutFile "$tools\sleuthkit.zip"
          Expand-Archive -Path "$tools\sleuthkit.zip" -DestinationPath "$tools\sleuthkit" -Force
          $sleuthkitDir = (Get-ChildItem -Path "$tools\sleuthkit" -Recurse -Filter "fls.exe" | Select-Object -First 1).DirectoryName
          if (-not $sleuthkitDir) { throw "fls.exe not found after extracting $($skAsset.name)" }
          Add-Content -Path $env:GITHUB_PATH -Value $sleuthkitDir

      - name: Install Python package
        run: pip install -e ".[dev]"

      - name: List devices (real hardware probe, diagnostic)
        run: python -c "from salvage.engine.devices import list_devices; import pprint; pprint.pprint(list_devices())"

      - name: Print engine binary discovery (diagnostic)
        run: python -m salvage --print-engine

      - name: Run tests
        run: python -m pytest -v

  build-windows:
    name: build (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install recovery tools (Windows)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $tools = "$env:RUNNER_TEMP\tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $ghHeaders = @{ Authorization = "Bearer $env:GH_TOKEN" }

          Invoke-WebRequest -Uri "https://www.cgsecurity.org/testdisk-7.2.win64.zip" -OutFile "$tools\testdisk.zip"
          Expand-Archive -Path "$tools\testdisk.zip" -DestinationPath "$tools\testdisk" -Force
          $photorecDir = (Get-ChildItem -Path "$tools\testdisk" -Recurse -Filter "photorec_win.exe" | Select-Object -First 1).DirectoryName
          if (-not $photorecDir) { throw "photorec_win.exe not found after extracting testdisk-7.2.win64.zip" }
          Add-Content -Path $env:GITHUB_PATH -Value $photorecDir

          $skRelease = Invoke-RestMethod -Uri "https://api.github.com/repos/sleuthkit/sleuthkit/releases/latest" -Headers $ghHeaders
          $skAsset = $skRelease.assets | Where-Object { $_.name -like "*win32*.zip" -or $_.name -like "*win64*.zip" } | Select-Object -First 1
          if (-not $skAsset) { throw "no Windows zip asset found on the latest sleuthkit release" }
          Invoke-WebRequest -Uri $skAsset.browser_download_url -OutFile "$tools\sleuthkit.zip"
          Expand-Archive -Path "$tools\sleuthkit.zip" -DestinationPath "$tools\sleuthkit" -Force
          $sleuthkitDir = (Get-ChildItem -Path "$tools\sleuthkit" -Recurse -Filter "fls.exe" | Select-Object -First 1).DirectoryName
          if (-not $sleuthkitDir) { throw "fls.exe not found after extracting $($skAsset.name)" }
          Add-Content -Path $env:GITHUB_PATH -Value $sleuthkitDir

      - name: Install Python package
        run: pip install -e ".[dev]"

      - name: Build with PyInstaller
        shell: pwsh
        run: packaging\build_windows.ps1

      - name: Zip the build
        shell: pwsh
        run: Compress-Archive -Path "dist\Salvage\*" -DestinationPath "Salvage-windows.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: Salvage-windows
          path: Salvage-windows.zip
          retention-days: 14
